[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-generic-many-to-many-field"
version = "0.1.0"
description = "A Django app providing generic many-to-many field functionality"
readme = "README.md"
authors = [
    {name = "Hussein Naeem", email = "husseinnaeemsec@users.noreply.github.com"}
]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["django", "field", "generic", "many-to-many", "contenttype"]
requires-python = ">=3.8"
dependencies = [
    "Django>=3.2",
]

[project.urls]
Homepage = "https://github.com/husseinnaeemsec/django_generic_many_to_many_field"
"Bug Reports" = "https://github.com/husseinnaeemsec/django_generic_many_to_many_field/issues"
Source = "https://github.com/husseinnaeemsec/django_generic_many_to_many_field"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "black>=22.0",
    "flake8>=4.0",
    "isort>=5.10",
]
